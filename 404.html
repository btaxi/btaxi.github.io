<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Btaxi - Redirection...</title>
    <script>
        // Redirection vers index.html en conservant le chemin actuel pour le routage SPA
        const pathSegmentsToKeep = 0; // Ajustez selon votre dépôt si nécessaire (ex: 1 pour /nom-du-repo/)
        const l = window.location;
        let pathname = l.pathname;
        
        // Si vous êtes dans un sous-dossier GitHub (ex: /btaxi/), décommentez et ajustez :
        // pathname = pathname.replace('/btaxi', '');

        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        );
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20vh; font-family: sans-serif; font-size: 15px;">Chargement de Btaxi...</p>
</body>
</html>
